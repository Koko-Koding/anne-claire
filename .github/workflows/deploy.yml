name: Deploy to GitHub Pages

# DISABLED: the site is now deployed via FTP to the production host
# (see scripts/deploy-ftp.js — run `bun run deploy`). The domain's DNS points at
# the FTP host, not GitHub Pages, so this workflow no longer publishes the live site.
# It is kept for reference and can be triggered manually from the Actions tab.
# To re-enable automatic deploys, restore the `push` trigger below.
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main  # Set this to your default branch

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install
      
      - name: Build
        run: bun run build
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4